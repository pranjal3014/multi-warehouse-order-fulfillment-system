          ports: [{ containerPort: 8083 }]
          envFrom: [{ configMapRef: { name: fulfillment-config } }, { secretRef: { name: fulfillment-secret } }]
          env: [{ name: DB_URL, value: jdbc:postgresql://postgres:5432/user_db }]
          livenessProbe: { httpGet: { path: /actuator/health, port: 8083 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: fulfillment }
spec: { selector: { app: user-service }, ports: [{ port: 8083, targetPort: 8083 }] }
---
apiVersion: apps/v1
