syntax = "proto3";

package cart;

option java_package = "com.fulfillment.cart.grpc";
option java_multiple_files = true;

service CartService {

  rpc GetCartByUserId (CartRequest) returns (CartResponse);

  rpc ClearCart (CartRequest) returns (CartOperationResponse);

}

message CartRequest {
  int64 userId = 1;
}

message CartItem {

  int64 productId = 1;
  int32 quantity = 2;

}

message CartResponse {

  int64 cartId = 1;
  int64 userId = 2;

  repeated CartItem items = 3;

}

message CartOperationResponse {

  bool success = 1;
  string message = 2;

}