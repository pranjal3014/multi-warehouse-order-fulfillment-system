spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.includes=*

spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/inventory/**

spring.cloud.gateway.server.webmvc.routes[2].id=pricing-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PRICING-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/pricing/**

spring.cloud.gateway.server.webmvc.routes[3].id=cart-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/cart/**

spring.cloud.gateway.server.webmvc.routes[4].id=order-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/order/**

spring.cloud.gateway.server.webmvc.routes[5].id=user-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/user/**