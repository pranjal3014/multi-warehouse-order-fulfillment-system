    spec:
      containers:
        - name: order-service
          image: fulfillment/order-service:latest
          ports: [{ containerPort: 8086 }]
          envFrom: [{ configMapRef: { name: fulfillment-config } }, { secretRef: { name: fulfillment-secret } }]
          env:
            - { name: DB_URL, value: jdbc:postgresql://postgres:5432/order_db }
            - { name: INVENTORY_GRPC_HOST, value: inventory-service }
            - { name: PRICING_GRPC_HOST, value: pricing-service }
            - { name: CART_GRPC_HOST, value: cart-service }
            - { name: PAYMENT_SERVICE_URL, value: http://payment-service:8087/graphql }
            - { name: SHIPMENT_SERVICE_URL, value: http://shipment-service:8088/graphql }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8086 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
