        - name: cart-service
          image: fulfillment/cart-service:latest
          ports: [{ containerPort: 8085 }, { containerPort: 9093 }]
          envFrom: [{ configMapRef: { name: fulfillment-config } }, { secretRef: { name: fulfillment-secret } }]
          env:
            - { name: DB_URL, value: jdbc:postgresql://postgres:5432/cart_db }
            - { name: INVENTORY_GRPC_HOST, value: inventory-service }
            - { name: PRICING_GRPC_HOST, value: pricing-service }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8085 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: cart-service, namespace: fulfillment }
