          env: [{ name: DB_URL, value: jdbc:postgresql://postgres:5432/payment_db }]
          livenessProbe: { httpGet: { path: /actuator/health, port: 8087 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: payment-service, namespace: fulfillment }
