version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fulfillment-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fulfillment-network

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10

    networks:
      - fulfillment-network

  service-registry:
    build:
      context: ./service-registry
    container_name: service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 15
    networks:
      - fulfillment-network

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  pricing-service:
    build:
      context: ./pricing-service
    container_name: pricing-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pricing_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  cart-service:
    build:
      context: ./cart-service
    container_name: cart-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cart_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      INVENTORY_GRPC_HOST: inventory-service
      PRICING_GRPC_HOST: pricing-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
      pricing-service:
        condition: service_started
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  shipment-service:
    build:
      context: ./shipment-service
    container_name: shipment-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shipment_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_GRPC_HOST: inventory-service
      PRICING_GRPC_HOST: pricing-service
      CART_GRPC_HOST: cart-service
      PAYMENT_SERVICE_URL: http://payment-service:8087/graphql
      SHIPMENT_SERVICE_URL: http://shipment-service:8088/graphql
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipment-service:
        condition: service_started
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8083/graphql
      JWT_SECRET: multi-warehouse-order-fulfillment-system-jwt-secret-key-2026
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      user-service:
        condition: service_started
      service-registry:
        condition: service_started
    networks:
      - fulfillment-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - fulfillment-network

volumes:
  postgres-data:

networks:
  fulfillment-network:
    driver: bridge
