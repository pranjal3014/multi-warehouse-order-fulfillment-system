global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api-gateway:8080]

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [product-service:8081]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [inventory-service:8082]

  - job_name: pricing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [pricing-service:8084]

  - job_name: cart-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [cart-service:8085]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8086]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [payment-service:8087]

  - job_name: shipment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [shipment-service:8088]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [notification-service:8089]
