apiVersion: v1
kind: Namespace
metadata:
  name: fulfillment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fulfillment-config
  namespace: fulfillment
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: fulfillment-secret
  namespace: fulfillment
type: Opaque
stringData:
  DB_USERNAME: postgres
  DB_PASSWORD: root
  JWT_SECRET: multi-warehouse-order-fulfillment-system-jwt-secret-key-2026
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: fulfillment
spec:
  replicas: 1
  selector:
    matchLabels: { app: service-registry }
  template:
    metadata: { labels: { app: service-registry } }
    spec:
      containers:
        - name: service-registry
          image: fulfillment/service-registry:latest
          ports: [{ containerPort: 8761 }]
          livenessProbe: { httpGet: { path: /actuator/health, port: 8761 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: fulfillment
spec:
  selector: { app: service-registry }
  ports: [{ port: 8761, targetPort: 8761 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: fulfillment
spec:
  replicas: 1
  selector: { matchLabels: { app: product-service } }
  template:
    metadata: { labels: { app: product-service } }
    spec:
      containers:
        - name: product-service
          image: fulfillment/product-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: fulfillment-config } }, { secretRef: { name: fulfillment-secret } }]
          env: [{ name: DB_URL, value: jdbc:postgresql://postgres:5432/product_db }]
          livenessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: product-service, namespace: fulfillment }
spec: { selector: { app: product-service }, ports: [{ port: 8081, targetPort: 8081 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory-service, namespace: fulfillment }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata: { labels: { app: inventory-service } }
    spec:
      containers:
        - name: inventory-service
          image: fulfillment/inventory-service:latest
          ports: [{ containerPort: 8082 }, { containerPort: 9095 }]
          envFrom: [{ configMapRef: { name: fulfillment-config } }, { secretRef: { name: fulfillment-secret } }]
          env: [{ name: DB_URL, value: jdbc:postgresql://postgres:5432/inventory_db }]
          livenessProbe: { httpGet: { path: /actuator/health, port: 8082 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: inventory-service, namespace: fulfillment }
spec: { selector: { app: inventory-service }, ports: [{ name: http, port: 8082, targetPort: 8082 }, { name: grpc, port: 9095, targetPort: 9095 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pricing-service, namespace: fulfillment }
spec:
  replicas: 1
  selector: { matchLabels: { app: pricing-service } }
  template:
    metadata: { labels: { app: pricing-service } }
    spec:
      containers:
        - name: pricing-service
          image: fulfillment/pricing-service:latest
          ports: [{ containerPort: 8084 }, { containerPort: 9091 }]
          envFrom: [{ configMapRef: { name: fulfillment-config } }, { secretRef: { name: fulfillment-secret } }]
          env: [{ name: DB_URL, value: jdbc:postgresql://postgres:5432/pricing_db }]
          livenessProbe: { httpGet: { path: /actuator/health, port: 8084 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: pricing-service, namespace: fulfillment }
spec: { selector: { app: pricing-service }, ports: [{ name: http, port: 8084, targetPort: 8084 }, { name: grpc, port: 9091, targetPort: 9091 }] }
---
