  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: fulfillment/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: fulfillment-config } }, { secretRef: { name: fulfillment-secret } }]
          env: [{ name: USER_SERVICE_URL, value: http://user-service:8083/graphql }]
          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: fulfillment }
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
