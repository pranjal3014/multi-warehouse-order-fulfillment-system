# Application
spring.application.name=CART-SERVICE
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cart_db
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# GraphQL
spring.graphql.graphiql.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Logging
logging.level.org.springframework.graphql=INFO

# gRPC Clients
spring.grpc.client.channels.pricing.address=discovery:///pricing-service
spring.grpc.client.channels.pricing.negotiation-type=plaintext

spring.grpc.client.channels.inventory.address=discovery:///inventory-service
spring.grpc.client.channels.inventory.negotiation-type=plaintext